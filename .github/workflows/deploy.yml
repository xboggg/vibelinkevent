name: Deploy VibeLink Event

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'DOCS/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-vibelinkevent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source tarball
        # Ship SOURCE for an on-server build. Excludes everything heavy or
        # generated: node_modules, dist, the legacy dist.tar.gz/.zip, the
        # 289M events/ tree (server already has it; mini-site code is
        # deployed manually), the 27M audio/ tree, and editor/dotfiles.
        # The GH-runner → server-38 network path drops scp after exactly
        # 120s, so the bundle must stay small (target: <10MB).
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./dist' \
              --exclude='./dist.tar.gz' \
              --exclude='./dist.zip' \
              --exclude='./.cache' \
              --exclude='./docs' \
              --exclude='./DOCS' \
              --exclude='./*.md' \
              --exclude='./backup_jan23' \
              --exclude='./audio' \
              --exclude='./events' \
              --exclude='./.env' \
              --exclude='./.env.local' \
              -czf /tmp/vibelinkevent-new.tar.gz .
          ls -lh /tmp/vibelinkevent-new.tar.gz

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship tarball to server
        # -O forces legacy SCP protocol — the deploy gate only allows `scp -t`.
        # ServerAliveInterval keeps the NAT path alive during the 70+MB upload
        # (some networks drop idle TCP after 120s).
        run: |
          scp -O -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=15 \
            /tmp/vibelinkevent-new.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/vibelinkevent-new.tar.gz

      - name: Run install on server
        run: |
          ssh -i ~/.ssh/deploy_key \
            -o ServerAliveInterval=20 -o ServerAliveCountMax=15 \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            /usr/local/bin/vibelinkevent-install
