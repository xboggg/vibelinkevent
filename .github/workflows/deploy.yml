name: Deploy VibeLink Event

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'DOCS/**'
      - 'LICENSE'
      - '.gitignore'
  workflow_dispatch:

concurrency:
  group: deploy-vibelinkevent
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Package source tarball
        # Ship SOURCE for an on-server build. Excludes everything heavy or
        # generated: node_modules, dist, the legacy dist.tar.gz/.zip, the
        # 289M events/ tree (server already has it; mini-site code is
        # deployed manually), the 27M audio/ tree, and editor/dotfiles.
        # The GH-runner → server-38 network path drops scp after exactly
        # 120s, so the bundle must stay small (target: <10MB).
        run: |
          tar --exclude='./.git' \
              --exclude='./.github' \
              --exclude='./node_modules' \
              --exclude='./dist' \
              --exclude='./dist.tar.gz' \
              --exclude='./dist.zip' \
              --exclude='./.cache' \
              --exclude='./docs' \
              --exclude='./DOCS' \
              --exclude='./*.md' \
              --exclude='./backup_jan23' \
              --exclude='./audio' \
              --exclude='./events' \
              --exclude='./.env' \
              --exclude='./.env.local' \
              -czf /tmp/vibelinkevent-new.tar.gz .
          ls -lh /tmp/vibelinkevent-new.tar.gz

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Ship tarball to relay (144) then forward to 38
        # Direct GH-runner → server-38 scp drops at exactly 120s (something
        # in the network path between them refuses long-running SSH). So we
        # send the bundle to server 144 first (works fine), and the
        # `vibelinkevent-forward` script on 144 scp's it onward to 38 (the
        # 144→38 path is fast, ~12s for 70MB) before triggering install.
        # -O forces legacy SCP — the deploy gate only allows `scp -t`.
        run: |
          scp -O -i ~/.ssh/deploy_key \
            /tmp/vibelinkevent-new.tar.gz \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/tmp/vibelinkevent-fwd.tar.gz

      - name: Trigger relay forward + install
        run: |
          ssh -i ~/.ssh/deploy_key \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} \
            /usr/local/bin/vibelinkevent-forward
