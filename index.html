<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fallback title + description only. Per-route <title>, meta,
         Open Graph, Twitter Card, canonical, and JSON-LD are owned by the
         SEO component (src/components/SEO.tsx via react-helmet) so that
         crawlers see the correct values for each page instead of these
         index.html defaults being duplicated by hydration. Do NOT add
         og:*, twitter:*, canonical, description, or ld+json here — the
         SEO component will inject a second copy and the two conflict. -->
    <title>Digital Invitations for Ghanaian Celebrations | VibeLink Event</title>
    <meta name="description" content="VibeLink builds interactive digital invitations for Ghanaian weddings, funerals, outdoorings, birthdays and corporate events. Share by link, track RSVPs." />
    <meta name="author" content="VibeLink Event" />
    <meta name="robots" content="index, follow" />

    <!-- Additional SEO -->
    <meta name="geo.region" content="GH" />
    <meta name="geo.placename" content="Ghana" />
    <meta name="theme-color" content="#7C3AED" />

    <!-- Google Search Console Verification - Replace with your actual verification code -->
    <meta name="google-site-verification" content="d7c567aac507448a" />

    <!-- Bing Webmaster Tools Verification -->
    <meta name="msvalidate.01" content="25E1D3FED6D9D6816000DEE936ECEBC8" />

    <!-- Additional Mobile Optimization -->
    <meta name="format-detection" content="telephone=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VibeLink Event" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Google Analytics -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6ZY31KPC0V"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-6ZY31KPC0V');
    </script>

    <!-- Structured Data — owned by src/components/SEO.tsx per route,
         which combines organizationSchema + websiteSchema + any page-specific
         schema into one <script>. Do not duplicate here. -->
  </head>

  <body>
    <div id="root"></div>
    <!-- reCAPTCHA loaded dynamically only when order form is opened -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
