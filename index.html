<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Fallback title + description only. Per-route <title>, meta,
         Open Graph, Twitter Card, canonical, and JSON-LD are owned by the
         SEO component (src/components/SEO.tsx via react-helmet) so that
         crawlers see the correct values for each page instead of these
         index.html defaults being duplicated by hydration. Do NOT add
         og:*, twitter:*, canonical, description, or ld+json here — the
         SEO component will inject a second copy and the two conflict. -->
    <!-- Static <title> is the last-resort fallback for pages/crawlers that
         don't wait for hydration. Per-route <title> and description come
         from the SEO component (react-helmet). We deliberately do NOT ship
         a static <meta name="description"> here: react-helmet's dedupe is
         unreliable when both a static tag and a helmet-injected tag share
         the same name, and we've caught a duplicate in production before
         (audit finding H14). -->
    <title>Digital Invitations for Ghanaian Celebrations | VibeLink Event</title>
    <meta name="author" content="VibeLink Event" />
    <meta name="robots" content="index, follow" />

    <!-- Additional SEO -->
    <meta name="geo.region" content="GH" />
    <meta name="geo.placename" content="Ghana" />
    <meta name="theme-color" content="#7C3AED" />

    <!-- Google Search Console Verification - Replace with your actual verification code -->
    <meta name="google-site-verification" content="d7c567aac507448a" />

    <!-- Bing Webmaster Tools Verification -->
    <meta name="msvalidate.01" content="25E1D3FED6D9D6816000DEE936ECEBC8" />

    <!-- Additional Mobile Optimization -->
    <meta name="format-detection" content="telephone=yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VibeLink Event" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Google Analytics with Consent Mode v2.
         Analytics is initialised with `analytics_storage: denied` by default,
         meaning no cookies are set and no personal data is collected until
         the visitor accepts the cookie banner (see src/components/CookieBanner.tsx).
         When the visitor accepts, the banner calls:
           gtag('consent', 'update', {analytics_storage: 'granted'});
         If they've already accepted in a previous session, the banner
         restores that granted state as soon as it mounts. Compliant with
         GDPR / ePrivacy directive requirements. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      // Set defaults BEFORE loading gtag.js so denied is the initial state.
      gtag('consent', 'default', {
        'analytics_storage': 'denied',
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'wait_for_update': 500
      });
      // If the visitor already accepted in a previous session, honour it
      // immediately so we don't lose the first page-view of the visit.
      try {
        if (localStorage.getItem('vl-cookie-consent') === 'accepted') {
          gtag('consent', 'update', { 'analytics_storage': 'granted' });
        }
      } catch (e) { /* localStorage may be unavailable in incognito */ }
      gtag('js', new Date());
      gtag('config', 'G-6ZY31KPC0V');
    </script>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-6ZY31KPC0V"></script>

    <!-- Structured Data — owned by src/components/SEO.tsx per route,
         which combines organizationSchema + websiteSchema + any page-specific
         schema into one <script>. Do not duplicate here. -->
  </head>

  <body>
    <div id="root"></div>
    <!-- reCAPTCHA loaded dynamically only when order form is opened -->
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
