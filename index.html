    <!--
      TEMPORARY scroll-diagnostic — active only on /admin. Logs EVERY caller
      of window.scrollTo, element.scrollTo, and any programmatic scrollTop
      write, with a full stack trace. Also logs visibilitychange, focus, and
      pageshow events so we can see if the scroll happens WHILE the tab is
      hidden or on refocus. Remove after we identify the culprit.
    -->
    <script>
      (function () {
        if (!location.pathname.startsWith('/admin')) return;
        var origWinScroll = window.scrollTo.bind(window);
        window.scrollTo = function () {
          console.groupCollapsed('[SCROLL-DEBUG] window.scrollTo', arguments, 'visible=' + !document.hidden);
          console.trace();
          console.groupEnd();
          return origWinScroll.apply(window, arguments);
        };
        var origElScroll = Element.prototype.scrollTo;
        Element.prototype.scrollTo = function () {
          if (this === document.documentElement || this === document.body) {
            console.groupCollapsed('[SCROLL-DEBUG] element.scrollTo (root)', arguments, 'visible=' + !document.hidden);
            console.trace();
            console.groupEnd();
          }
          return origElScroll.apply(this, arguments);
        };
        var scrollTopDesc = Object.getOwnPropertyDescriptor(Element.prototype, 'scrollTop');
        if (scrollTopDesc && scrollTopDesc.set) {
          var origSetter = scrollTopDesc.set;
          Object.defineProperty(Element.prototype, 'scrollTop', {
            configurable: true,
            enumerable: scrollTopDesc.enumerable,
            get: scrollTopDesc.get,
            set: function (v) {
              if (this === document.documentElement || this === document.body) {
                console.groupCollapsed('[SCROLL-DEBUG] scrollTop=' + v, 'visible=' + !document.hidden);
                console.trace();
                console.groupEnd();
              }
              return origSetter.call(this, v);
            }
          });
        }
        document.addEventListener('visibilitychange', function () {
          console.log('[SCROLL-DEBUG] visibilitychange visible=' + !document.hidden, 'scrollY=' + window.scrollY);
        });
        window.addEventListener('focus', function () {
          console.log('[SCROLL-DEBUG] window focus scrollY=' + window.scrollY);
        });
        window.addEventListener('pageshow', function (e) {
          console.log('[SCROLL-DEBUG] pageshow persisted=' + e.persisted + ' scrollY=' + window.scrollY);
        });
        console.log('[SCROLL-DEBUG] tracer armed on /admin');
      })();
    </script>
