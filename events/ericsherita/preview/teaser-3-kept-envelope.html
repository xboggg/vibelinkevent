<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Teaser Direction 3 — The Kept Envelope — Eric &amp; Sherita</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cinzel:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --ivory:#f5f2e8;
    --cream:#f7efdd;
    --cream-warm:#f0e6cc;
    --cream-shadow:#c9b98a;
    --sage:#7d8e6d;
    --sage-soft:#a5b490;
    --sage-deep:#5a6b4c;
    --sage-dark:#3d4a32;
    --gold:#c9a24a;
    --gold-bright:#d4b464;
    --gold-deep:#8a6a23;
    --wood-a:#4a2e1c;
    --wood-b:#2a180a;
    --wood-c:#150a03;
    --ink:#2a2e26;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;overflow-x:hidden;background:#0a0603}
  body{
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
    position:relative;overflow-x:hidden;
    background:
      radial-gradient(ellipse at 50% 12%, rgba(255,205,140,.2) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 60%, rgba(90,60,35,.6) 0%, rgba(20,10,5,.85) 65%, rgba(6,3,1,1) 100%),
      linear-gradient(180deg, var(--wood-a) 0%, var(--wood-b) 55%, var(--wood-c) 100%);
    min-height:100vh;min-height:100svh;
    color:var(--ivory);
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(92deg,
        transparent 0px,
        rgba(0,0,0,.10) 1px,
        transparent 4px,
        rgba(139,90,50,.06) 8px,
        transparent 16px,
        rgba(0,0,0,.08) 32px,
        transparent 56px);
    opacity:.9;mix-blend-mode:overlay;
  }

  .back{
    position:fixed;top:1rem;left:1rem;z-index:200;
    width:44px;height:44px;border-radius:50%;
    background:rgba(245,242,232,.85);
    border:1px solid var(--gold);color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:.95rem;
    transition:all .3s;box-shadow:0 6px 16px rgba(0,0,0,.55);
  }
  .back:hover{background:#fff;transform:scale(1.06)}
  .label{
    position:fixed;top:1.15rem;right:1rem;z-index:200;
    font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;
    color:rgba(212,180,100,.65);text-transform:uppercase;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    max-width:60vw;text-align:right;
  }
  .label b{color:var(--gold-bright);font-weight:500}

  /* Petals */
  .petal-field{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .petal{
    position:absolute;top:-40px;
    width:14px;height:22px;opacity:0;
    animation:petalFall linear infinite;
    will-change:transform;
  }
  .petal svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  @keyframes petalFall{
    0%{opacity:0;transform:translate(0,-40px) rotate(0)}
    8%{opacity:.85}
    50%{transform:translate(var(--drift), 55vh) rotate(180deg)}
    92%{opacity:.7}
    100%{opacity:0;transform:translate(calc(var(--drift) * 1.6), 110vh) rotate(360deg)}
  }

  /* Dove */
  .dove{
    position:fixed;
    width:82px;height:60px;
    z-index:50;pointer-events:none;
    filter:
      drop-shadow(0 4px 12px rgba(0,0,0,.55))
      drop-shadow(0 0 8px rgba(255,240,200,.35));
    animation:doveOrbit 34s linear infinite;
    will-change:top,left,transform;
  }
  @keyframes doveOrbit{
    0%   {top:8vh;  left:5vw;  transform:scaleX(1)}
    12%  {top:5vh;  left:30vw; transform:scaleX(1)}
    25%  {top:8vh;  left:60vw; transform:scaleX(1)}
    38%  {top:22vh; left:88vw; transform:scaleX(1)}
    49%  {top:70vh; left:92vw; transform:scaleX(1)}
    50%  {top:72vh; left:92vw; transform:scaleX(-1)}
    62%  {top:85vh; left:60vw; transform:scaleX(-1)}
    75%  {top:82vh; left:30vw; transform:scaleX(-1)}
    88%  {top:60vh; left:5vw;  transform:scaleX(-1)}
    99%  {top:12vh; left:5vw;  transform:scaleX(-1)}
    99.5%{top:10vh; left:5vw;  transform:scaleX(1)}
    100% {top:8vh;  left:5vw;  transform:scaleX(1)}
  }
  .dove-wing{
    fill:#fff;
    transform-origin:60% 55%;
    animation:wingFlap .8s ease-in-out infinite;
  }
  @keyframes wingFlap{
    0%,100%{transform:rotate(-6deg)}
    50%{transform:rotate(22deg)}
  }

  .stage{
    position:relative;z-index:3;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:5rem 1.5rem 4rem;text-align:center;
  }

  .reveal{opacity:0;transform:translateY(15px)}
  .reveal.in{opacity:1;transform:translateY(0);transition:opacity 1.4s ease, transform 1.4s ease}

  .top-orn{
    display:flex;align-items:center;justify-content:center;gap:1rem;
    margin-bottom:1.4rem;color:var(--gold-bright);
    max-width:200px;margin-left:auto;margin-right:auto;
  }
  .top-orn .fl{flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold-bright), transparent)}
  .top-orn svg{width:22px;height:22px;fill:var(--gold-bright)}

  .overline{
    font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.55em;
    color:var(--gold-bright);text-transform:uppercase;
    margin-bottom:1.2rem;font-weight:500;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
  }

  .names{
    font-family:'Great Vibes',cursive;
    font-size:clamp(4rem, 11vw, 6.4rem);
    color:var(--ivory);line-height:1;letter-spacing:.005em;
    margin-bottom:1.4rem;
    text-shadow:0 3px 24px rgba(0,0,0,.65), 0 0 50px rgba(212,180,100,.2);
  }
  .names .amp{
    display:inline-block;font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--gold-bright);font-size:.5em;
    vertical-align:middle;margin:0 .2rem;font-weight:500;
  }

  .date-line{
    font-family:'Cinzel',serif;color:var(--ivory);
    font-size:clamp(.9rem, 2vw, 1.05rem);
    letter-spacing:.4em;padding:.7rem 0;
    border-top:1px solid rgba(212,180,100,.5);
    border-bottom:1px solid rgba(212,180,100,.5);
    display:inline-block;padding-left:1.4rem;padding-right:1rem;
    font-weight:500;margin-bottom:1rem;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .venue-line{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:#e8e3d0;font-size:1rem;letter-spacing:.03em;
    margin-bottom:2.6rem;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }

  /* ========== THE KEPT ENVELOPE ========== */
  .env-wrap{
    position:relative;width:100%;max-width:340px;
    margin:0 auto 2.4rem;
    aspect-ratio:1.55/1;
  }
  .env{
    position:relative;width:100%;height:100%;
    animation:envIdle 6s ease-in-out infinite;
  }
  @keyframes envIdle{
    0%,100%{transform:rotate(-.4deg)}
    50%{transform:rotate(.4deg)}
  }
  .env-shadow{
    position:absolute;bottom:-24px;left:5%;right:5%;height:28px;
    background:radial-gradient(ellipse at center, rgba(0,0,0,.65) 0%, transparent 70%);
    filter:blur(12px);z-index:-1;
  }
  .env-paper{
    position:relative;width:100%;height:100%;
    background:linear-gradient(178deg, var(--cream) 0%, var(--cream-warm) 55%, var(--cream-shadow) 100%);
    box-shadow:
      0 0 0 1px rgba(90,65,25,.28),
      inset 0 2px 0 rgba(255,245,215,.5),
      inset 3px 0 8px rgba(90,65,25,.06),
      inset -3px 0 8px rgba(90,65,25,.10),
      inset 0 -12px 20px rgba(90,65,25,.12);
    overflow:visible;
  }
  .env-paper::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' seed='9'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.42 0 0 0 0 0.22 0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;opacity:.85;
  }
  /* Flap (closed) */
  .flap{
    position:absolute;top:0;left:0;width:100%;height:66%;
    clip-path:polygon(0 0, 100% 0, 50% 100%);
    background:linear-gradient(180deg, var(--cream) 0%, var(--cream-warm) 60%, #d9c592 100%);
    box-shadow:inset 0 -30px 40px rgba(120,85,30,.18), inset 0 2px 0 rgba(255,245,215,.5);
    z-index:2;
  }
  .flap::before{
    content:'';position:absolute;inset:0;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='0.85' numOctaves='2' seed='11'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.42 0 0 0 0 0.22 0 0 0 0.09 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;opacity:.85;
  }
  .crease{
    position:absolute;top:65.5%;left:0;right:0;height:2px;
    background:linear-gradient(180deg, rgba(90,65,25,.35), transparent);
    z-index:3;pointer-events:none;
    box-shadow:0 -1px 2px rgba(255,245,215,.3);
  }

  /* Main sage wax "R.S.V.P." seal centered */
  .wax{
    position:absolute;top:42%;left:50%;
    transform:translate(-50%,-50%);
    width:82px;height:82px;
    z-index:5;
    animation:waxPulse 3s ease-in-out infinite;
    filter:drop-shadow(0 6px 12px rgba(0,0,0,.5));
  }
  @keyframes waxPulse{
    0%,100%{transform:translate(-50%,-50%) scale(1)}
    50%{transform:translate(-50%,-50%) scale(1.04)}
  }
  .wax-disc{
    position:absolute;inset:0;border-radius:50%;
    background:
      radial-gradient(circle at 30% 25%, #c8d5b3 0%, #a5b490 30%, #7d8e6d 60%, #4a5a3e 85%, #2a3520 100%);
    box-shadow:
      inset 0 -6px 12px rgba(0,0,0,.45),
      inset 0 3px 6px rgba(255,255,255,.15),
      inset -3px -2px 6px rgba(0,0,0,.25),
      inset 3px 2px 5px rgba(255,255,255,.1);
  }
  .wax-rim{
    position:absolute;inset:5px;border-radius:50%;
    border:1px dashed rgba(245,242,232,.32);
  }
  .wax-label{
    position:absolute;inset:0;
    display:flex;align-items:center;justify-content:center;
    font-family:'Cinzel',serif;font-weight:600;font-size:.55rem;
    color:rgba(245,242,232,.92);letter-spacing:.18em;
    text-align:center;line-height:1.3;
    text-shadow:0 -1px 0 rgba(0,0,0,.4), 0 1px 0 rgba(255,255,255,.12);
  }

  /* ========== HORIZONTAL COUNTDOWN ========== */
  .cd-row{
    display:flex;justify-content:center;gap:.55rem;margin-bottom:2.4rem;flex-wrap:wrap;
  }
  .cd-tile{
    min-width:58px;padding:.65rem .35rem;
    background:rgba(245,242,232,.06);
    backdrop-filter:blur(6px);
    border:1px solid rgba(212,180,100,.35);
    text-align:center;border-radius:2px;
  }
  .cd-num{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:1.55rem;
    color:var(--gold-bright);line-height:1;
    text-shadow:0 2px 8px rgba(0,0,0,.4);
  }
  .cd-label{
    font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.34em;
    color:#e8e3d0;text-transform:uppercase;margin-top:.4rem;font-weight:500;
  }

  /* CTA */
  .cta-title{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:#e8e3d0;font-size:1rem;letter-spacing:.03em;
    margin-bottom:1.4rem;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .cta-row{
    display:flex;justify-content:center;gap:.8rem;flex-wrap:wrap;
    margin-bottom:2.4rem;
  }
  .cta-btn{
    display:inline-flex;align-items:center;gap:.55rem;
    padding:.85rem 1.4rem;text-decoration:none;
    font-family:'Cinzel',serif;font-size:.62rem;letter-spacing:.3em;
    text-transform:uppercase;font-weight:500;
    background:rgba(245,242,232,.06);
    backdrop-filter:blur(6px);
    border:1px solid rgba(212,180,100,.5);
    color:var(--gold-bright);
    border-radius:99px;
    transition:all .35s ease;
  }
  .cta-btn:hover{
    background:rgba(212,180,100,.12);
    border-color:var(--gold-bright);
    color:#fff;
    box-shadow:0 6px 18px rgba(212,180,100,.3);
    transform:translateY(-2px);
  }
  .cta-btn i{font-size:.85rem}

  .share{
    display:inline-flex;align-items:center;gap:.7rem;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:rgba(245,242,232,.82);font-size:1rem;
    text-decoration:none;cursor:pointer;background:none;border:0;
    padding-top:1.6rem;
    border-top:1px solid rgba(212,180,100,.22);
    transition:color .3s;
    animation:shareGlow 3s ease-in-out infinite 5s;
  }
  @keyframes shareGlow{
    0%,100%{color:rgba(245,242,232,.82)}
    50%{color:var(--gold-bright)}
  }
  .share i{color:#25D366;font-size:1.15rem}
  .share span{border-bottom:1px dotted rgba(245,242,232,.4)}

  @media(max-width:640px){
    .stage{padding:4rem 1rem 3rem}
    .names{font-size:3.8rem;margin-bottom:1.1rem}
    .date-line{font-size:.82rem;letter-spacing:.3em;padding-left:1rem;padding-right:.6rem}
    .venue-line{font-size:.9rem;margin-bottom:2rem}
    .env-wrap{max-width:280px;margin-bottom:2rem}
    .wax{width:70px;height:70px}
    .wax-label{font-size:.5rem;letter-spacing:.14em}
    .cd-tile{min-width:52px;padding:.55rem .25rem}
    .cd-num{font-size:1.3rem}
    .cd-label{font-size:.46rem}
    .cta-row{gap:.55rem}
    .cta-btn{padding:.75rem 1.1rem;font-size:.56rem;letter-spacing:.26em}
    .cta-title{font-size:.92rem}
    .share{font-size:.9rem}
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="doveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="60%" stop-color="#f3ede0"/>
      <stop offset="100%" stop-color="#d9d0b8"/>
    </linearGradient>
    <linearGradient id="petalSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b490"/>
      <stop offset="50%" stop-color="#7d8e6d"/>
      <stop offset="100%" stop-color="#5a6b4c"/>
    </linearGradient>
    <linearGradient id="petalCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7efdd"/>
      <stop offset="50%" stop-color="#e8dcb8"/>
      <stop offset="100%" stop-color="#c9b98a"/>
    </linearGradient>
  </defs>
</svg>
</head>
<body>

<a href="index.html" class="back" aria-label="Back to gallery"><i class="fas fa-arrow-left"></i></a>
<div class="label"><b>Teaser 3</b> &middot; Kept Envelope</div>

<div class="petal-field" id="petalField"></div>

<div class="dove">
  <svg viewBox="0 0 82 60" xmlns="http://www.w3.org/2000/svg">
    <path fill="url(#doveGrad)" d="M 8 32 Q 2 30 4 26 L 12 28 Q 10 32 8 32 Z" opacity=".85"/>
    <path fill="url(#doveGrad)" d="M 6 36 Q 0 36 2 32 L 12 32 Q 10 36 6 36 Z" opacity=".9"/>
    <path fill="url(#doveGrad)" d="M 14 30 Q 12 22 22 20 Q 34 16 46 20 Q 58 22 62 28 Q 60 36 52 38 Q 40 42 26 40 Q 16 38 14 30 Z"/>
    <circle fill="url(#doveGrad)" cx="60" cy="24" r="8"/>
    <path fill="#d4b464" d="M 66 24 L 74 22 L 68 27 Z"/>
    <circle fill="#5a6b4c" cx="62" cy="22" r="1.3"/>
    <path class="dove-wing" d="M 26 22 Q 30 4 44 10 Q 54 14 50 24 Q 42 30 32 28 Q 24 26 26 22 Z" fill="#fff" stroke="rgba(90,107,76,.2)" stroke-width=".5"/>
  </svg>
</div>

<div class="stage">
  <div class="top-orn reveal" id="orn" aria-hidden="true">
    <span class="fl"></span>
    <svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg>
    <span class="fl"></span>
  </div>
  <div class="overline reveal" id="r1">Save the Date</div>
  <h1 class="names reveal" id="r2">Eric <span class="amp">&amp;</span> Sherita</h1>
  <div class="date-line reveal" id="r3">SAT &middot; 28 NOV 2026 &middot; 12PM</div>
  <div class="venue-line reveal" id="r4">North Brunswick, New Jersey</div>

  <div class="env-wrap reveal" id="r5">
    <div class="env">
      <div class="env-shadow"></div>
      <div class="env-paper">
        <div class="flap"></div>
        <div class="crease"></div>
        <div class="wax">
          <div class="wax-disc"></div>
          <div class="wax-rim"></div>
          <div class="wax-label">R.S.V.P.<br>E &amp; S</div>
        </div>
      </div>
    </div>
  </div>

  <div class="cd-row reveal" id="r6" aria-label="Countdown">
    <div class="cd-tile"><div class="cd-num" id="cdDays">--</div><div class="cd-label">Days</div></div>
    <div class="cd-tile"><div class="cd-num" id="cdHours">--</div><div class="cd-label">Hours</div></div>
    <div class="cd-tile"><div class="cd-num" id="cdMin">--</div><div class="cd-label">Minutes</div></div>
    <div class="cd-tile"><div class="cd-num" id="cdSec">--</div><div class="cd-label">Seconds</div></div>
  </div>

  <div class="cta-title reveal" id="r7">Save this day to your calendar</div>
  <div class="cta-row reveal" id="r8">
    <a class="cta-btn" href="#" target="_blank" rel="noopener"><i class="fab fa-google"></i> Google</a>
    <a class="cta-btn" href="#" download><i class="fab fa-apple"></i> Apple</a>
    <a class="cta-btn" href="#" download><i class="fas fa-envelope"></i> Outlook</a>
  </div>

  <button class="share reveal" id="r9" onclick="alert('Share opens WhatsApp with the link + preview')">
    <i class="fab fa-whatsapp"></i>
    <span>Share with family &amp; friends</span>
  </button>
</div>

<script>
/* Petals */
const petalShapes = [
  '<svg viewBox="0 0 40 60"><path d="M 20 2 Q 4 20 6 40 Q 10 55 20 58 Q 30 55 34 40 Q 36 20 20 2 Z" fill="url(#petalSage)"/><path d="M 20 8 L 20 54" stroke="#3d4a32" stroke-width="1" opacity=".35"/></svg>',
  '<svg viewBox="0 0 40 60"><path d="M 20 2 Q 4 20 6 40 Q 10 55 20 58 Q 30 55 34 40 Q 36 20 20 2 Z" fill="url(#petalCream)"/><path d="M 20 8 L 20 54" stroke="#8a6a23" stroke-width="1" opacity=".35"/></svg>',
  '<svg viewBox="0 0 40 60"><ellipse cx="20" cy="30" rx="18" ry="28" fill="url(#petalSage)"/></svg>',
];
const petalField = document.getElementById('petalField');
for (let i = 0; i < 22; i++){
  const p = document.createElement('div');
  p.className = 'petal';
  p.innerHTML = petalShapes[i % petalShapes.length];
  p.style.left = (Math.random() * 100) + 'vw';
  p.style.animationDuration = (14 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 12) + 's';
  p.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
  const scale = 0.7 + Math.random() * 0.6;
  p.style.transform = `scale(${scale})`;
  petalField.appendChild(p);
}

/* Sequenced reveal */
const seq = ['orn','r1','r2','r3','r4','r5','r6','r7','r8','r9'];
seq.forEach((id, i) => {
  setTimeout(() => document.getElementById(id).classList.add('in'), 200 + i * 260);
});

/* Countdown */
const targetDate = new Date('2026-11-28T17:00:00+00:00').getTime();
function tick(){
  const now = Date.now();
  let diff = Math.max(0, targetDate - now);
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);
  const s = Math.floor((diff / 1000) % 60);
  document.getElementById('cdDays').textContent = String(d).padStart(2,'0');
  document.getElementById('cdHours').textContent = String(h).padStart(2,'0');
  document.getElementById('cdMin').textContent = String(m).padStart(2,'0');
  document.getElementById('cdSec').textContent = String(s).padStart(2,'0');
}
tick(); setInterval(tick, 1000);
</script>

</body>
</html>
