<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Concept 4: Golden Hour Fade — Eric &amp; Sherita</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Cinzel:wght@400;500;600&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --ivory:#f5f2e8; --sage:#7d8e6d; --sage-deep:#5a6b4c;
    --gold:#c9a24a; --gold-bright:#d4b464; --gold-deep:#8a6a23;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;margin:0}
  body{
    font-family:'Cormorant Garamond',serif;
    background:#0a0a0a;color:var(--ivory);
    position:relative;overflow:hidden;
    -webkit-font-smoothing:antialiased;
    cursor:pointer;
  }

  .back{
    position:fixed;top:1rem;left:1rem;z-index:100;
    width:42px;height:42px;border-radius:50%;
    background:rgba(245,242,232,.15);backdrop-filter:blur(8px);
    border:1px solid rgba(212,180,100,.4);color:var(--gold-bright);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:.95rem;
    transition:all .3s;
  }
  .back:hover{background:rgba(245,242,232,.25);transform:scale(1.05)}
  .label{
    position:fixed;top:1.1rem;right:1rem;z-index:100;
    font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;
    color:rgba(245,242,232,.55);text-transform:uppercase;
  }
  .label b{color:var(--gold-bright);font-weight:500}

  /* Hero photo — held still for 3s, then very slow pull-back */
  .hero-bg{
    position:absolute;inset:0;z-index:0;
    background-image:url('../hero-medium.jpg');
    background-size:cover;background-position:center 35%;
    transform:scale(1.35);
    transition:transform 12s cubic-bezier(.4,0,.2,1);
    will-change:transform;
  }
  @media(min-width:1201px){.hero-bg{background-image:url('../hero.jpg')}}
  @media(max-width:640px){.hero-bg{background-image:url('../hero-mobile.jpg')}}
  .hero-bg.pullback{transform:scale(1.02)}

  .grade{
    position:absolute;inset:0;z-index:1;
    background:
      linear-gradient(180deg, rgba(20,15,5,.15) 0%, rgba(15,12,4,.5) 100%),
      radial-gradient(ellipse at 30% 40%, rgba(212,180,100,.18) 0%, transparent 60%);
    mix-blend-mode:multiply;
    pointer-events:none;
  }

  /* Lens flare — bright gold streak drifts left → right across ~4s */
  .flare{
    position:absolute;top:35%;left:-30%;
    width:60%;height:120px;z-index:3;
    background:
      radial-gradient(ellipse at center, rgba(212,180,100,.7) 0%, rgba(201,162,74,.4) 30%, transparent 65%),
      linear-gradient(90deg, transparent 0%, rgba(255,225,150,.65) 50%, transparent 100%);
    filter:blur(18px);opacity:0;
    transform:rotate(-8deg);
    pointer-events:none;
  }
  .flare.drift{
    animation:flareDrift 4.2s ease-in-out forwards;
  }
  @keyframes flareDrift{
    0%{left:-40%;opacity:0}
    10%{opacity:.4}
    50%{opacity:.85}
    90%{opacity:.5}
    100%{left:110%;opacity:0}
  }

  /* Sun bloom on tap-to-enter */
  .bloom{
    position:absolute;top:50%;left:50%;
    width:20px;height:20px;
    background:radial-gradient(circle, #fff 0%, rgba(255,225,150,.8) 30%, transparent 70%);
    border-radius:50%;
    transform:translate(-50%,-50%) scale(1);
    opacity:0;z-index:8;
    pointer-events:none;
  }
  .bloom.on{
    animation:bloomOut 1.4s ease-out forwards;
  }
  @keyframes bloomOut{
    0%{opacity:0;transform:translate(-50%,-50%) scale(1)}
    30%{opacity:1;transform:translate(-50%,-50%) scale(3)}
    100%{opacity:0;transform:translate(-50%,-50%) scale(60)}
  }

  /* Dust motes */
  .mote{
    position:absolute;width:3px;height:3px;
    background:radial-gradient(circle, rgba(255,220,140,.9), transparent 70%);
    border-radius:50%;
    pointer-events:none;
    z-index:2;
    animation:moteFloat 14s linear infinite;
    opacity:0;
  }
  @keyframes moteFloat{
    0%{opacity:0;transform:translateY(20vh) translateX(0)}
    15%{opacity:.9}
    85%{opacity:.5}
    100%{opacity:0;transform:translateY(-15vh) translateX(30px)}
  }

  /* Botanical branches grow in from corners */
  .botanical{
    position:absolute;width:180px;height:180px;z-index:4;
    opacity:0;transition:opacity 2s ease;
  }
  .botanical.in{opacity:.7}
  .botanical.tl{top:1rem;left:1rem}
  .botanical.br{bottom:1rem;right:1rem;transform:rotate(180deg)}
  .botanical path,.botanical circle{
    fill:none;stroke:var(--gold-bright);stroke-width:1.4;
    stroke-dasharray:600;stroke-dashoffset:600;
    filter:drop-shadow(0 0 6px rgba(212,180,100,.35));
  }
  .botanical.in path,.botanical.in circle{
    animation:branchDraw 2.6s ease-out forwards;
  }
  @keyframes branchDraw{
    to{stroke-dashoffset:0}
  }

  /* Text overlay */
  .content{
    position:absolute;inset:0;z-index:5;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:2rem 1.5rem;
    pointer-events:none;
  }
  .flourish{
    display:flex;align-items:center;justify-content:center;gap:1rem;
    margin-bottom:1.4rem;color:var(--gold-bright);
    width:100%;max-width:340px;
    opacity:0;transition:opacity 1.4s ease;
  }
  .flourish.in{opacity:1}
  .flourish .fl{flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold-bright), transparent)}
  .flourish svg{width:22px;height:22px;fill:var(--gold-bright);filter:drop-shadow(0 2px 8px rgba(212,180,100,.5))}

  .overline{
    font-family:'Cinzel',serif;font-size:.72rem;letter-spacing:.55em;
    color:var(--gold-bright);text-transform:uppercase;
    margin-bottom:1.2rem;font-weight:500;
    text-shadow:0 2px 10px rgba(0,0,0,.6);
    opacity:0;transition:opacity 1.2s ease;
  }
  .overline.in{opacity:1}

  .names{
    font-family:'Great Vibes',cursive;
    font-size:clamp(4rem, 11vw, 7rem);
    color:var(--ivory);line-height:1;letter-spacing:.01em;
    text-shadow:0 3px 26px rgba(0,0,0,.65), 0 0 40px rgba(212,180,100,.25);
    margin:.4rem 0 1rem;
    opacity:0;transform:scale(.94);
    transition:opacity 2s ease, transform 2s cubic-bezier(.2,.8,.3,1);
  }
  .names.in{opacity:1;transform:scale(1)}
  .names .amp{
    display:inline-block;font-family:'Cormorant Garamond',serif;font-style:italic;
    font-weight:500;color:var(--gold-bright);font-size:.5em;
    vertical-align:middle;margin:0 .2rem;
  }

  .date{
    font-family:'Cinzel',serif;color:var(--ivory);
    font-size:clamp(.85rem, 1.9vw, 1rem);
    letter-spacing:.42em;padding:.65rem 0;
    border-top:1px solid rgba(212,180,100,.55);
    border-bottom:1px solid rgba(212,180,100,.55);
    display:inline-block;padding-left:1.5rem;padding-right:1rem;
    margin-top:.8rem;font-weight:500;
    opacity:0;transform:scaleX(.6);transform-origin:center;
    transition:opacity 1.4s ease, transform 1.4s ease;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }
  .date.in{opacity:1;transform:scaleX(1)}

  .cta-hint{
    position:absolute;bottom:2rem;left:0;right:0;
    text-align:center;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:rgba(245,242,232,.85);font-size:.98rem;
    letter-spacing:.05em;
    text-shadow:0 2px 8px rgba(0,0,0,.6);
    opacity:0;transition:opacity 1.4s ease;
    z-index:6;
  }
  .cta-hint.in{opacity:1;animation:hintPulse 3s ease-in-out infinite 1s}
  @keyframes hintPulse{0%,100%{opacity:.85}50%{opacity:1}}
  .cta-hint i{color:var(--gold-bright);margin-right:.5rem}

  .exit-overlay{
    position:fixed;inset:0;background:var(--ivory);
    display:flex;align-items:center;justify-content:center;
    text-align:center;padding:2rem;
    opacity:0;pointer-events:none;
    transition:opacity 1.2s ease;z-index:200;
  }
  .exit-overlay.on{opacity:1;pointer-events:auto}
  .exit-content{max-width:400px}
  .exit-eyebrow{
    font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.5em;
    color:var(--gold-deep);text-transform:uppercase;margin-bottom:.9rem;
  }
  .exit-title{
    font-family:'Great Vibes',cursive;color:var(--sage-deep);
    font-size:3rem;line-height:1;margin-bottom:1.2rem;
  }
  .exit-title .a{color:var(--gold);font-family:'Cormorant Garamond',serif;font-style:italic;font-size:.5em;vertical-align:middle;margin:0 .2rem}
  .exit-note{color:var(--sage-deep);font-style:italic;font-size:1.05rem;margin-bottom:2rem}
  .exit-btn{
    display:inline-flex;align-items:center;gap:.6rem;
    padding:.9rem 1.7rem;background:var(--sage);color:#fff;
    border:1px solid var(--sage-deep);
    font-family:'Cinzel',serif;font-size:.7rem;letter-spacing:.32em;
    text-transform:uppercase;border-radius:99px;text-decoration:none;
    box-shadow:0 4px 12px rgba(90,107,76,.3);
    transition:all .3s;
  }
  .exit-btn:hover{background:var(--sage-deep);transform:translateY(-2px)}

  @media(max-width:640px){
    .botanical{width:130px;height:130px}
  }
</style>
</head>
<body>

<a href="index.html" class="back" aria-label="Back to gallery"><i class="fas fa-arrow-left"></i></a>
<div class="label"><b>04</b> · Golden Hour Fade</div>

<div class="hero-bg" id="heroBg"></div>
<div class="grade"></div>
<div class="flare" id="flare"></div>
<div class="bloom" id="bloom"></div>

<svg class="botanical tl" id="botTl" viewBox="0 0 180 180" aria-hidden="true">
  <path d="M 10 10 Q 40 25 60 60 Q 80 100 130 130 Q 150 150 170 170"/>
  <path d="M 25 20 Q 20 45 40 55"/>
  <path d="M 40 40 Q 55 50 50 70"/>
  <path d="M 55 60 Q 70 75 68 95"/>
  <path d="M 85 100 Q 95 110 95 130"/>
  <path d="M 115 125 Q 130 135 128 155"/>
  <circle cx="22" cy="47" r="3.5"/>
  <circle cx="48" cy="68" r="3.5"/>
  <circle cx="68" cy="92" r="3.5"/>
  <circle cx="98" cy="128" r="3.5"/>
</svg>
<svg class="botanical br" id="botBr" viewBox="0 0 180 180" aria-hidden="true">
  <path d="M 10 10 Q 40 25 60 60 Q 80 100 130 130 Q 150 150 170 170"/>
  <path d="M 25 20 Q 20 45 40 55"/>
  <path d="M 40 40 Q 55 50 50 70"/>
  <path d="M 55 60 Q 70 75 68 95"/>
  <path d="M 85 100 Q 95 110 95 130"/>
  <path d="M 115 125 Q 130 135 128 155"/>
  <circle cx="22" cy="47" r="3.5"/>
  <circle cx="48" cy="68" r="3.5"/>
  <circle cx="68" cy="92" r="3.5"/>
  <circle cx="98" cy="128" r="3.5"/>
</svg>

<div class="content">
  <div class="flourish" id="flourish" aria-hidden="true">
    <span class="fl"></span>
    <svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg>
    <span class="fl"></span>
  </div>
  <div class="overline" id="overline">Save the Date</div>
  <h1 class="names" id="names">Eric <span class="amp">&amp;</span> Sherita</h1>
  <div class="date" id="date">SAT &middot; 28 NOV 2026 &middot; 12PM</div>
</div>

<div class="cta-hint" id="cta"><i class="fas fa-hand-point-up"></i> Tap anywhere to enter</div>

<div class="exit-overlay" id="exit">
  <div class="exit-content">
    <div class="exit-eyebrow">Splash concept</div>
    <div class="exit-title">Golden Hour <span class="a">&amp;</span> Grow</div>
    <div class="exit-note">In the real site, the tap-to-enter opens either the Save-the-Date teaser or the full invitation, depending on the URL.</div>
    <a href="index.html" class="exit-btn"><i class="fas fa-arrow-left"></i> Back to concepts</a>
  </div>
</div>

<script>
/* Sprinkle dust motes */
for (let i = 0; i < 12; i++){
  const m = document.createElement('div');
  m.className = 'mote';
  m.style.left = Math.random() * 100 + 'vw';
  m.style.animationDuration = (10 + Math.random() * 8) + 's';
  m.style.animationDelay = (Math.random() * 6) + 's';
  document.body.appendChild(m);
}

/* Timeline */
const steps = [
  { at: 3000, act: () => document.getElementById('heroBg').classList.add('pullback') },
  { at: 3200, act: () => document.getElementById('flare').classList.add('drift') },
  { at: 4200, act: () => document.getElementById('flourish').classList.add('in') },
  { at: 4400, act: () => document.getElementById('overline').classList.add('in') },
  { at: 4800, act: () => document.getElementById('names').classList.add('in') },
  { at: 5400, act: () => { document.getElementById('botTl').classList.add('in'); document.getElementById('botBr').classList.add('in'); } },
  { at: 6200, act: () => document.getElementById('date').classList.add('in') },
  { at: 7600, act: () => document.getElementById('cta').classList.add('in') },
];
steps.forEach(s => setTimeout(s.act, s.at));

const startTime = Date.now();
document.body.addEventListener('click', e => {
  if (e.target.closest('.back') || e.target.closest('.exit-overlay')) return;
  if (Date.now() - startTime < 7600){
    /* Skip: jump to the fully lit state */
    document.getElementById('heroBg').classList.add('pullback');
    ['flourish','overline','names','date','cta','botTl','botBr'].forEach(id => document.getElementById(id).classList.add('in'));
    return;
  }
  /* Sun-bloom transition on exit */
  document.getElementById('bloom').classList.add('on');
  setTimeout(() => document.getElementById('exit').classList.add('on'), 900);
});
</script>

</body>
</html>
