<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Teaser Direction 1 — The Continuation Card — Eric &amp; Sherita</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Cinzel:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --ivory:#f5f2e8;
    --cream:#f7efdd;
    --cream-warm:#f0e6cc;
    --cream-shadow:#c9b98a;
    --card-cream:#fbf5e7;
    --card-warm:#f2e9cf;
    --sage:#7d8e6d;
    --sage-soft:#a5b490;
    --sage-deep:#5a6b4c;
    --sage-dark:#3d4a32;
    --gold:#c9a24a;
    --gold-bright:#d4b464;
    --gold-deep:#8a6a23;
    --wood-a:#4a2e1c;
    --wood-b:#2a180a;
    --wood-c:#150a03;
    --ink:#2a2e26;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;overflow-x:hidden;background:#0a0603}
  body{
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
    position:relative;overflow-x:hidden;
    background:
      radial-gradient(ellipse at 50% 12%, rgba(255,205,140,.22) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 60%, rgba(90,60,35,.6) 0%, rgba(20,10,5,.85) 65%, rgba(6,3,1,1) 100%),
      linear-gradient(180deg, var(--wood-a) 0%, var(--wood-b) 55%, var(--wood-c) 100%);
    min-height:100vh;min-height:100svh;
  }
  body::before{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:
      repeating-linear-gradient(92deg,
        transparent 0px,
        rgba(0,0,0,.10) 1px,
        transparent 4px,
        rgba(139,90,50,.06) 8px,
        transparent 16px,
        rgba(0,0,0,.08) 32px,
        transparent 56px);
    opacity:.9;mix-blend-mode:overlay;
  }
  body::after{
    content:'';position:fixed;inset:0;pointer-events:none;z-index:0;
    background:radial-gradient(ellipse at 50% 100%, rgba(0,0,0,.5) 0%, transparent 65%);
  }

  .back{
    position:fixed;top:1rem;left:1rem;z-index:200;
    width:44px;height:44px;border-radius:50%;
    background:rgba(245,242,232,.9);
    border:1px solid var(--gold);color:var(--sage-deep);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:.95rem;
    transition:all .3s;
    box-shadow:0 6px 16px rgba(0,0,0,.55);
  }
  .back:hover{background:#fff;transform:scale(1.06)}
  .label{
    position:fixed;top:1.15rem;right:1rem;z-index:200;
    font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;
    color:rgba(212,180,100,.65);text-transform:uppercase;
    text-shadow:0 2px 6px rgba(0,0,0,.6);
    max-width:60vw;text-align:right;
  }
  .label b{color:var(--gold-bright);font-weight:500}

  /* ========== FALLING PETALS ========== */
  .petal-field{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
  .petal{
    position:absolute;top:-40px;
    width:14px;height:22px;opacity:0;
    animation:petalFall linear infinite;
    will-change:transform;
  }
  .petal svg{width:100%;height:100%;filter:drop-shadow(0 2px 4px rgba(0,0,0,.35))}
  @keyframes petalFall{
    0%{opacity:0;transform:translate(0,-40px) rotate(0)}
    8%{opacity:.85}
    50%{transform:translate(var(--drift), 55vh) rotate(180deg)}
    92%{opacity:.7}
    100%{opacity:0;transform:translate(calc(var(--drift) * 1.6), 110vh) rotate(360deg)}
  }

  /* ========== DOVE ========== */
  .dove{
    position:fixed;
    width:82px;height:60px;
    z-index:50;pointer-events:none;
    filter:
      drop-shadow(0 4px 12px rgba(0,0,0,.55))
      drop-shadow(0 0 8px rgba(255,240,200,.35));
    animation:doveOrbit 34s linear infinite;
    will-change:top,left,transform;
  }
  @keyframes doveOrbit{
    0%   {top:8vh;  left:5vw;  transform:scaleX(1)}
    12%  {top:5vh;  left:30vw; transform:scaleX(1)}
    25%  {top:8vh;  left:60vw; transform:scaleX(1)}
    38%  {top:22vh; left:88vw; transform:scaleX(1)}
    49%  {top:70vh; left:92vw; transform:scaleX(1)}
    50%  {top:72vh; left:92vw; transform:scaleX(-1)}
    62%  {top:85vh; left:60vw; transform:scaleX(-1)}
    75%  {top:82vh; left:30vw; transform:scaleX(-1)}
    88%  {top:60vh; left:5vw;  transform:scaleX(-1)}
    99%  {top:12vh; left:5vw;  transform:scaleX(-1)}
    99.5%{top:10vh; left:5vw;  transform:scaleX(1)}
    100% {top:8vh;  left:5vw;  transform:scaleX(1)}
  }
  .dove-wing{
    fill:#fff;
    transform-origin:60% 55%;
    animation:wingFlap .8s ease-in-out infinite;
  }
  @keyframes wingFlap{
    0%,100%{transform:rotate(-6deg)}
    50%{transform:rotate(22deg)}
  }

  /* ========== CARD ========== */
  .stage{
    position:relative;z-index:3;
    min-height:100vh;
    min-height:100svh;
    display:flex;align-items:center;justify-content:center;
    padding:3rem 1.5rem;
  }

  .card{
    position:relative;
    width:100%;max-width:460px;
    background:
      radial-gradient(ellipse at 50% 30%, rgba(255,247,220,.5) 0%, transparent 60%),
      linear-gradient(180deg, var(--card-cream) 0%, var(--card-warm) 60%, #eadeb8 100%);
    box-shadow:
      0 40px 60px rgba(0,0,0,.6),
      0 18px 28px rgba(0,0,0,.45),
      0 0 0 1px rgba(139,109,58,.28),
      0 0 0 4px rgba(255,247,220,.35),
      0 0 0 5px rgba(139,109,58,.15),
      inset 0 2px 0 rgba(255,255,255,.7),
      inset 0 -30px 40px rgba(139,109,58,.06);
    padding:2.6rem 1.8rem 2rem;
    text-align:center;
    overflow:hidden;
    opacity:0;
    animation:cardEnter 1.4s cubic-bezier(.2,.85,.3,1) .3s forwards;
  }
  @keyframes cardEnter{
    0%{opacity:0;transform:translateY(20px) scale(.96)}
    100%{opacity:1;transform:translateY(0) scale(1)}
  }
  .card::before{
    content:'';position:absolute;inset:0;pointer-events:none;z-index:1;
    background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence baseFrequency='0.82' numOctaves='2' seed='23'/><feColorMatrix values='0 0 0 0 0.55 0 0 0 0 0.42 0 0 0 0 0.22 0 0 0 0.08 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    mix-blend-mode:multiply;opacity:.85;
  }
  .card::after{
    content:'E & S';
    position:absolute;top:50%;left:50%;
    transform:translate(-50%,-50%);
    font-family:'Great Vibes', cursive;
    font-size:11rem;color:var(--sage);
    opacity:.05;
    pointer-events:none;z-index:1;
    letter-spacing:.05em;white-space:nowrap;
  }

  /* Gold-foil border */
  .trace-svg{
    position:absolute;inset:8px;pointer-events:none;
    z-index:3;opacity:0;
    animation:traceFade .8s ease 1.4s forwards;
  }
  @keyframes traceFade{to{opacity:1}}
  .trace-svg rect{
    fill:none;stroke:url(#goldFoil);
    stroke-width:1.5;
    stroke-dasharray:3600;stroke-dashoffset:3600;
    filter:drop-shadow(0 0 3px rgba(212,180,100,.55));
    animation:traceLine 2.4s ease-out 1.4s forwards;
  }
  @keyframes traceLine{to{stroke-dashoffset:0}}
  .trace-inner{
    position:absolute;inset:14px;pointer-events:none;
    z-index:3;
    border:0.5px solid var(--gold-deep);
    opacity:0;
    animation:innerFade .8s ease 4s forwards;
  }
  @keyframes innerFade{to{opacity:.5}}

  /* Corner leaves — same as v8 */
  .card-corner{
    position:absolute;width:32px;height:32px;pointer-events:none;
    z-index:4;opacity:0;
    animation:cornerFade .8s ease 2.5s forwards;
  }
  @keyframes cornerFade{to{opacity:.85}}
  .card-corner svg{width:100%;height:100%;filter:drop-shadow(0 1px 1px rgba(90,107,76,.2))}
  .card-corner.tl{top:6px;left:6px}
  .card-corner.tr{top:6px;right:6px;transform:scaleX(-1)}
  .card-corner.bl{bottom:6px;left:6px;transform:scaleY(-1)}
  .card-corner.br{bottom:6px;right:6px;transform:scale(-1,-1)}

  /* Eucalyptus sprig top */
  .sprig{
    position:absolute;top:-8px;left:50%;transform:translateX(-50%) scale(.85);
    z-index:5;width:56px;height:26px;
    opacity:0;
    animation:sprigIn 1s ease 1.8s forwards;
  }
  @keyframes sprigIn{
    to{opacity:.9;transform:translateX(-50%) scale(1)}
  }

  .card-content{position:relative;z-index:5}

  .card-flourish{display:flex;align-items:center;justify-content:center;gap:.7rem;margin-bottom:.5rem;color:var(--gold-deep);width:100%;max-width:200px;margin-left:auto;margin-right:auto;margin-top:.4rem}
  .card-flourish .fl{flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold), transparent)}
  .card-flourish svg{width:16px;height:16px;fill:var(--gold-deep)}

  .card-overline{
    font-family:'Cinzel',serif;font-size:.66rem;letter-spacing:.55em;
    color:var(--gold-deep);text-transform:uppercase;font-weight:600;
    margin-bottom:.4rem;text-shadow:0 1px 0 rgba(255,255,255,.7);
  }
  .card-italic{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--sage-deep);font-size:.95rem;margin-bottom:0;
  }
  .card-names{
    font-family:'Great Vibes',cursive;
    font-size:clamp(2.8rem, 6.6vw, 3.4rem);
    color:var(--sage-deep);line-height:1;margin:.1rem 0 .8rem;
    text-shadow:0 1px 1px rgba(255,255,255,.6), 0 -1px 0 rgba(90,107,76,.15);
  }
  .card-names .amp{
    display:inline-block;font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--gold-deep);font-size:.55em;vertical-align:middle;margin:0 .1rem;font-weight:500;
  }
  .card-date{
    font-family:'Cinzel',serif;color:var(--sage-deep);
    font-size:.74rem;letter-spacing:.36em;padding:.4rem 0;
    border-top:1px solid var(--gold-deep);border-bottom:1px solid var(--gold-deep);
    display:inline-block;padding-left:1rem;padding-right:.6rem;font-weight:500;
    background:linear-gradient(180deg, transparent, rgba(255,247,220,.3), transparent);
  }
  .card-venue{font-family:'Cormorant Garamond',serif;font-style:italic;color:var(--sage-deep);font-size:.82rem;margin-top:.55rem;letter-spacing:.02em}

  /* ========== COUNTDOWN — cream tiles with gold rules ========== */
  .countdown{
    display:flex;justify-content:center;gap:.55rem;margin:1.6rem auto 1.2rem;flex-wrap:wrap;
    padding:0 .2rem;
  }
  .cd-tile{
    flex:1;min-width:56px;max-width:78px;
    padding:.65rem .35rem;
    background:linear-gradient(180deg, rgba(255,247,220,.65) 0%, rgba(242,233,207,.4) 100%);
    border-top:1px solid var(--gold-deep);
    border-bottom:1px solid var(--gold-deep);
    text-align:center;
    position:relative;
  }
  .cd-tile::before, .cd-tile::after{
    content:'';position:absolute;top:0;bottom:0;width:1px;
    background:linear-gradient(180deg, transparent, var(--gold), transparent);
    opacity:.4;
  }
  .cd-tile::before{left:0}
  .cd-tile::after{right:0}
  .cd-num{
    font-family:'Cormorant Garamond',serif;font-weight:600;
    font-size:1.65rem;
    color:var(--sage-deep);line-height:1;
  }
  .cd-label{
    font-family:'Cinzel',serif;font-size:.5rem;letter-spacing:.32em;
    color:var(--gold-deep);text-transform:uppercase;margin-top:.4rem;font-weight:500;
  }

  /* Divider before "full invitation" line */
  .invite-divider{
    display:flex;align-items:center;justify-content:center;gap:.6rem;
    margin:1.3rem auto .9rem;max-width:220px;color:var(--gold-deep);
  }
  .invite-divider .fl{flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold-deep), transparent)}
  .invite-divider svg{width:9px;height:9px;fill:var(--gold-deep)}

  .card-note{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--sage-deep);font-size:.9rem;
    margin-bottom:1.4rem;line-height:1.55;
  }
  .card-note em{color:var(--gold-deep);font-style:italic}

  /* R.S.V.P. calendar row — 3 gold-outlined icon pills in a row */
  .cal-title{
    font-family:'Cinzel',serif;font-size:.58rem;letter-spacing:.42em;
    color:var(--gold-deep);text-transform:uppercase;font-weight:600;
    margin-bottom:.7rem;
  }
  .cal-row{
    display:flex;justify-content:center;gap:.6rem;margin-bottom:1.2rem;
    padding:0 .2rem;
  }
  .cal-btn{
    flex:1;max-width:100px;
    padding:.7rem .3rem;text-decoration:none;
    display:flex;flex-direction:column;align-items:center;gap:.35rem;
    border:1px solid var(--gold-deep);border-radius:2px;
    background:linear-gradient(180deg, rgba(255,247,220,.5), rgba(242,233,207,.3));
    color:var(--sage-deep);
    transition:all .3s;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 1px 2px rgba(139,109,58,.15);
    cursor:pointer;
  }
  .cal-btn:hover{
    background:linear-gradient(135deg, var(--sage-soft), var(--sage));
    color:#fff;
    box-shadow:0 4px 12px rgba(90,107,76,.35);
    transform:translateY(-2px);
    border-color:var(--sage-deep);
  }
  .cal-btn i{font-size:1.1rem;color:var(--gold-deep);transition:color .3s}
  .cal-btn:hover i{color:#fff}
  .cal-btn span{
    font-family:'Cinzel',serif;font-size:.52rem;letter-spacing:.22em;
    text-transform:uppercase;font-weight:600;
  }

  .share-line{
    display:inline-flex;align-items:center;gap:.5rem;
    margin-top:.5rem;padding-top:1rem;
    border-top:1px solid rgba(201,162,74,.3);
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--sage-deep);font-size:.95rem;
    text-decoration:none;cursor:pointer;
    background:none;border-left:0;border-right:0;border-bottom:0;
    width:100%;justify-content:center;
    transition:color .3s;
    animation:shareGlow 3s ease-in-out infinite 4s;
  }
  @keyframes shareGlow{
    0%,100%{color:var(--sage-deep)}
    50%{color:var(--gold-deep)}
  }
  .share-line i{color:#25D366;font-size:1.05rem}
  .share-line span{border-bottom:1px dotted rgba(139,109,58,.5)}

  @media(max-width:640px){
    .stage{padding:2.5rem 1.2rem}
    .card{padding:2.2rem 1.4rem 1.8rem;max-width:340px}
    .card::after{font-size:8rem}
    .card-names{font-size:2.7rem}
    .cd-tile{min-width:52px;padding:.55rem .25rem}
    .cd-num{font-size:1.4rem}
    .cd-label{font-size:.46rem}
    .cal-btn i{font-size:1rem}
    .cal-btn span{font-size:.46rem;letter-spacing:.18em}
  }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="doveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff"/>
      <stop offset="60%" stop-color="#f3ede0"/>
      <stop offset="100%" stop-color="#d9d0b8"/>
    </linearGradient>
    <linearGradient id="petalSage" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a5b490"/>
      <stop offset="50%" stop-color="#7d8e6d"/>
      <stop offset="100%" stop-color="#5a6b4c"/>
    </linearGradient>
    <linearGradient id="petalCream" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7efdd"/>
      <stop offset="50%" stop-color="#e8dcb8"/>
      <stop offset="100%" stop-color="#c9b98a"/>
    </linearGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8a6a23"/>
      <stop offset="20%" stop-color="#c9a24a"/>
      <stop offset="40%" stop-color="#f0d78a"/>
      <stop offset="60%" stop-color="#d4b464"/>
      <stop offset="80%" stop-color="#c9a24a"/>
      <stop offset="100%" stop-color="#8a6a23"/>
    </linearGradient>
  </defs>
</svg>
</head>

<div class="petal-field" id="petalField"></div>

<div class="dove" id="dove">
  <svg viewBox="0 0 82 60" xmlns="http://www.w3.org/2000/svg">
    <path fill="url(#doveGrad)" d="M 8 32 Q 2 30 4 26 L 12 28 Q 10 32 8 32 Z" opacity=".85"/>
    <path fill="url(#doveGrad)" d="M 6 36 Q 0 36 2 32 L 12 32 Q 10 36 6 36 Z" opacity=".9"/>
    <path fill="url(#doveGrad)" d="M 14 30 Q 12 22 22 20 Q 34 16 46 20 Q 58 22 62 28 Q 60 36 52 38 Q 40 42 26 40 Q 16 38 14 30 Z"/>
    <circle fill="url(#doveGrad)" cx="60" cy="24" r="8"/>

</div>

<div class="stage">
  <div class="card">
    <svg class="trace-svg" preserveAspectRatio="none" viewBox="0 0 400 460">
      <rect x="1.5" y="1.5" width="397" height="457"/>
    </svg>
    <div class="trace-inner"></div>

    <div class="card-corner tl">
      <svg viewBox="0 0 32 32">
        <path d="M 4 28 Q 10 20 20 12 Q 26 8 28 6" fill="none" stroke="var(--sage-deep)" stroke-width=".9" opacity=".65" stroke-linecap="round"/>
        <ellipse cx="14" cy="18" rx="3" ry="5.5" fill="url(#petalSage)" transform="rotate(-35 14 18)" opacity=".9"/>
        <circle cx="28" cy="6" r="1.5" fill="var(--gold)"/>
      </svg>
    </div>
    <div class="card-corner tr">
      <svg viewBox="0 0 32 32">
        <path d="M 4 28 Q 10 20 20 12 Q 26 8 28 6" fill="none" stroke="var(--sage-deep)" stroke-width=".9" opacity=".65" stroke-linecap="round"/>
        <ellipse cx="14" cy="18" rx="3" ry="5.5" fill="url(#petalSage)" transform="rotate(-35 14 18)" opacity=".9"/>
        <circle cx="28" cy="6" r="1.5" fill="var(--gold)"/>
      </svg>
    </div>
    <div class="card-corner bl">
      <svg viewBox="0 0 32 32">
        <path d="M 4 28 Q 10 20 20 12 Q 26 8 28 6" fill="none" stroke="var(--sage-deep)" stroke-width=".9" opacity=".65" stroke-linecap="round"/>
        <ellipse cx="14" cy="18" rx="3" ry="5.5" fill="url(#petalSage)" transform="rotate(-35 14 18)" opacity=".9"/>
        <circle cx="28" cy="6" r="1.5" fill="var(--gold)"/>
      </svg>
    </div>
    <div class="card-corner br">
      <svg viewBox="0 0 32 32">
        <path d="M 4 28 Q 10 20 20 12 Q 26 8 28 6" fill="none" stroke="var(--sage-deep)" stroke-width=".9" opacity=".65" stroke-linecap="round"/>
        <ellipse cx="14" cy="18" rx="3" ry="5.5" fill="url(#petalSage)" transform="rotate(-35 14 18)" opacity=".9"/>
        <circle cx="28" cy="6" r="1.5" fill="var(--gold)"/>
      </svg>
    </div>

    <svg class="sprig" viewBox="0 0 56 26">
      <path d="M 28 22 L 28 2" stroke="var(--sage-deep)" stroke-width="1" fill="none"/>
      <ellipse cx="22" cy="10" rx="4" ry="6" fill="url(#petalSage)" transform="rotate(-30 22 10)"/>
      <ellipse cx="34" cy="10" rx="4" ry="6" fill="url(#petalSage)" transform="rotate(30 34 10)"/>
      <ellipse cx="18" cy="16" rx="3.5" ry="5" fill="url(#petalSage)" transform="rotate(-20 18 16)"/>
      <ellipse cx="38" cy="16" rx="3.5" ry="5" fill="url(#petalSage)" transform="rotate(20 38 16)"/>
      <ellipse cx="14" cy="22" rx="3" ry="4" fill="url(#petalSage)" transform="rotate(-10 14 22)"/>
      <ellipse cx="42" cy="22" rx="3" ry="4" fill="url(#petalSage)" transform="rotate(10 42 22)"/>
      <circle cx="28" cy="4" r="2.5" fill="var(--gold)"/>
    </svg>

    <div class="card-content">
      <div class="card-flourish"><span class="fl"></span><svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg><span class="fl"></span></div>
      <div class="card-overline">Save the Date</div>
      <div class="card-italic">for the wedding of</div>
      <h1 class="card-names">Eric <span class="amp">&amp;</span> Sherita</h1>
      <div class="card-date">SAT &middot; 28 NOV 2026 &middot; 12PM</div>
      <div class="card-venue">North Brunswick, New Jersey</div>

      <div class="countdown" aria-label="Countdown">
        <div class="cd-tile"><div class="cd-num" id="cdDays">--</div><div class="cd-label">Days</div></div>
        <div class="cd-tile"><div class="cd-num" id="cdHours">--</div><div class="cd-label">Hours</div></div>
        <div class="cd-tile"><div class="cd-num" id="cdMin">--</div><div class="cd-label">Minutes</div></div>
        <div class="cd-tile"><div class="cd-num" id="cdSec">--</div><div class="cd-label">Seconds</div></div>
      </div>

      <div class="invite-divider" aria-hidden="true">
        <span class="fl"></span>
        <svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg>
        <span class="fl"></span>
      </div>

      <div class="card-note">A full invitation will follow.<br><em>For now &mdash; block the day.</em></div>

      <div class="cal-title">Add to Your Calendar</div>
      <div class="cal-row">
        <a class="cal-btn" href="#" target="_blank" rel="noopener">
          <i class="fab fa-google"></i>
          <span>Google</span>
        </a>
        <a class="cal-btn" href="#" download>
          <i class="fab fa-apple"></i>
          <span>Apple</span>
        </a>
        <a class="cal-btn" href="#" download>
          <i class="fas fa-envelope"></i>
          <span>Outlook</span>
        </a>
      </div>

      <button class="share-line" onclick="alert('Share opens WhatsApp with the link + preview')">
        <i class="fab fa-whatsapp"></i>
        <span>Share this joy with family &amp; friends</span>
      </button>
    </div>
  </div>
</div>

<script>
/* Petals */
const petalShapes = [
  '<svg viewBox="0 0 40 60"><path d="M 20 2 Q 4 20 6 40 Q 10 55 20 58 Q 30 55 34 40 Q 36 20 20 2 Z" fill="url(#petalSage)"/><path d="M 20 8 L 20 54" stroke="#3d4a32" stroke-width="1" opacity=".35"/></svg>',
  '<svg viewBox="0 0 40 60"><path d="M 20 2 Q 4 20 6 40 Q 10 55 20 58 Q 30 55 34 40 Q 36 20 20 2 Z" fill="url(#petalCream)"/><path d="M 20 8 L 20 54" stroke="#8a6a23" stroke-width="1" opacity=".35"/></svg>',
  '<svg viewBox="0 0 40 60"><ellipse cx="20" cy="30" rx="18" ry="28" fill="url(#petalSage)"/></svg>',
];
const petalField = document.getElementById('petalField');
for (let i = 0; i < 22; i++){
  const p = document.createElement('div');
  p.className = 'petal';
  p.innerHTML = petalShapes[i % petalShapes.length];
  p.style.left = (Math.random() * 100) + 'vw';
  p.style.animationDuration = (14 + Math.random() * 10) + 's';
  p.style.animationDelay = (Math.random() * 12) + 's';
  p.style.setProperty('--drift', (Math.random() * 200 - 100) + 'px');
  const scale = 0.7 + Math.random() * 0.6;
  p.style.transform = `scale(${scale})`;
  petalField.appendChild(p);
}

/* Countdown */
const targetDate = new Date('2026-11-28T17:00:00+00:00').getTime();
function tick(){
  const now = Date.now();
  let diff = Math.max(0, targetDate - now);
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);
  const s = Math.floor((diff / 1000) % 60);
  document.getElementById('cdDays').textContent = String(d).padStart(2,'0');
  document.getElementById('cdHours').textContent = String(h).padStart(2,'0');
  document.getElementById('cdMin').textContent = String(m).padStart(2,'0');
  document.getElementById('cdSec').textContent = String(s).padStart(2,'0');
}
tick(); setInterval(tick, 1000);
</script>
