<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="robots" content="noindex, nofollow" />
<title>Teaser Direction 2 — The Cinematic Stage — Eric &amp; Sherita</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Cinzel:wght@400;500;600;700&family=Great+Vibes&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
<style>
  :root{
    --ivory:#f5f2e8;
    --sage:#7d8e6d;
    --sage-soft:#a5b490;
    --sage-deep:#5a6b4c;
    --sage-dark:#3d4a32;
    --gold:#c9a24a;
    --gold-bright:#d4b464;
    --gold-deep:#8a6a23;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{min-height:100%;overflow-x:hidden}
  body{
    font-family:'Cormorant Garamond',serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse at 50% 5%, rgba(212,180,100,.14) 0%, transparent 55%),
      radial-gradient(ellipse at 50% 40%, rgba(90,107,76,.15) 0%, transparent 65%),
      radial-gradient(ellipse at center, #232821 0%, #0e120c 60%, #050603 100%);
    color:var(--ivory);
    min-height:100vh;min-height:100svh;
    position:relative;overflow-x:hidden;
  }

  /* Spotlight cone from above */
  body::before{
    content:'';position:fixed;top:0;left:50%;transform:translateX(-50%);
    width:80vw;max-width:600px;height:60vh;
    background:radial-gradient(ellipse at top, rgba(212,180,100,.14) 0%, transparent 65%);
    pointer-events:none;z-index:0;
    animation:beamPulse 6s ease-in-out infinite;
  }
  @keyframes beamPulse{
    0%,100%{opacity:.8}
    50%{opacity:1}
  }

  /* Dust motes */
  .mote{
    position:fixed;width:2px;height:2px;
    background:radial-gradient(circle, rgba(255,220,140,.9), transparent 70%);
    border-radius:50%;
    animation:moteFloat 18s linear infinite;
    z-index:1;pointer-events:none;
    opacity:0;
  }
  @keyframes moteFloat{
    0%{opacity:0;transform:translateY(25vh) translateX(0)}
    15%{opacity:.85}
    88%{opacity:.5}
    100%{opacity:0;transform:translateY(-15vh) translateX(30px)}
  }

  .back{
    position:fixed;top:1rem;left:1rem;z-index:200;
    width:44px;height:44px;border-radius:50%;
    background:rgba(245,242,232,.15);backdrop-filter:blur(8px);
    border:1px solid rgba(212,180,100,.4);color:var(--gold-bright);
    display:flex;align-items:center;justify-content:center;
    text-decoration:none;font-size:.95rem;
    transition:all .3s;
  }
  .back:hover{background:rgba(245,242,232,.25);transform:scale(1.05)}
  .label{
    position:fixed;top:1.15rem;right:1rem;z-index:200;
    font-family:'Cinzel',serif;font-size:.6rem;letter-spacing:.4em;
    color:rgba(212,180,100,.6);text-transform:uppercase;
  }
  .label b{color:var(--gold-bright);font-weight:500}

  .stage{
    position:relative;z-index:3;
    min-height:100vh;min-height:100svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:6rem 1.5rem 4rem;text-align:center;
  }

  /* Rising type - each element fades up in sequence */
  .reveal{opacity:0;transform:translateY(20px)}
  .reveal.in{opacity:1;transform:translateY(0);transition:opacity 1.6s ease, transform 1.6s ease}

  .top-orn{
    display:flex;align-items:center;justify-content:center;gap:1rem;
    margin-bottom:1.6rem;color:var(--gold-bright);
    max-width:180px;margin-left:auto;margin-right:auto;
  }
  .top-orn .fl{flex:1;height:1px;background:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    transform:scaleX(0);transform-origin:center;transition:transform 1.4s ease}
  .top-orn.in .fl{transform:scaleX(1)}
  .top-orn svg{width:22px;height:22px;fill:var(--gold-bright);opacity:0;transition:opacity .8s ease .8s}
  .top-orn.in svg{opacity:1}

  .overline{
    font-family:'Cinzel',serif;font-size:.8rem;letter-spacing:.6em;
    color:var(--gold-bright);text-transform:uppercase;
    margin-bottom:1.6rem;font-weight:500;
    text-shadow:0 2px 12px rgba(0,0,0,.6);
  }

  .italic{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
    color:#e8e3d0;font-size:1.2rem;letter-spacing:.03em;
    margin-bottom:1rem;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }

  .names{
    font-family:'Great Vibes',cursive;
    font-size:clamp(4.6rem, 13vw, 8.5rem);
    color:var(--ivory);line-height:1;letter-spacing:.005em;
    margin-bottom:1.8rem;
    text-shadow:0 3px 30px rgba(0,0,0,.7), 0 0 60px rgba(212,180,100,.25);
  }
  .names .amp{
    display:inline-block;font-family:'Cormorant Garamond',serif;font-style:italic;
    color:var(--gold-bright);font-size:.48em;
    vertical-align:middle;margin:0 .2rem;font-weight:500;
  }

  .date-line{
    font-family:'Cinzel',serif;color:var(--ivory);
    font-size:clamp(1rem, 2.2vw, 1.25rem);
    letter-spacing:.42em;padding:.85rem 0;
    border-top:1px solid rgba(212,180,100,.5);
    border-bottom:1px solid rgba(212,180,100,.5);
    display:inline-block;padding-left:1.6rem;padding-right:1.1rem;
    font-weight:500;margin-bottom:1.4rem;
    text-shadow:0 2px 10px rgba(0,0,0,.5);
  }

  .venue-line{
    font-family:'Cormorant Garamond',serif;font-style:italic;font-weight:300;
    color:#e8e3d0;font-size:1rem;letter-spacing:.04em;
    margin-bottom:3.4rem;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }

  /* HUGE inline countdown "146 · 03 · 46 · 27" */
  .countdown-line{
    display:flex;align-items:center;justify-content:center;gap:.5rem;
    margin-bottom:.6rem;flex-wrap:wrap;
  }
  .cd-num{
    font-family:'Cormorant Garamond',serif;font-weight:500;
    font-size:clamp(3rem, 8vw, 4.4rem);
    color:var(--gold-bright);line-height:1;
    text-shadow:0 3px 18px rgba(0,0,0,.6);
    min-width:1.4em;text-align:center;
  }
  .cd-dot{
    width:8px;height:8px;border-radius:50%;
    background:var(--gold-bright);
    filter:drop-shadow(0 0 4px rgba(212,180,100,.6));
  }
  .cd-labels{
    display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;
    margin-bottom:3.4rem;padding:0 .4rem;
  }
  .cd-labels span{
    font-family:'Cinzel',serif;font-size:.55rem;letter-spacing:.42em;
    color:rgba(245,242,232,.65);text-transform:uppercase;font-weight:500;
    min-width:4em;text-align:center;
  }

  /* Single-line CTA */
  .cta-title{
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:#e8e3d0;font-size:1.1rem;letter-spacing:.04em;
    margin-bottom:1.6rem;
    text-shadow:0 2px 8px rgba(0,0,0,.5);
  }
  .cta-row{
    display:flex;justify-content:center;gap:1rem;flex-wrap:wrap;
    margin-bottom:2.4rem;padding:0 1rem;
  }
  .cta-btn{
    display:inline-flex;align-items:center;gap:.65rem;
    padding:.9rem 1.5rem;text-decoration:none;
    font-family:'Cinzel',serif;font-size:.65rem;letter-spacing:.32em;
    text-transform:uppercase;font-weight:500;
    background:transparent;
    border:1px solid rgba(212,180,100,.55);
    color:var(--gold-bright);
    border-radius:0;
    transition:all .35s cubic-bezier(.2,.8,.3,1);
    box-shadow:0 4px 14px rgba(0,0,0,.3);
    position:relative;overflow:hidden;
  }
  .cta-btn::before{
    content:'';position:absolute;top:0;left:-100%;width:100%;height:100%;
    background:linear-gradient(90deg, transparent, rgba(212,180,100,.15), transparent);
    transition:left .8s ease;
  }
  .cta-btn:hover::before{left:100%}
  .cta-btn:hover{
    background:rgba(212,180,100,.1);
    border-color:var(--gold-bright);
    color:#fff;
    box-shadow:0 8px 22px rgba(212,180,100,.35);
    transform:translateY(-2px);
  }
  .cta-btn i{font-size:.85rem}

  .share{
    display:inline-flex;align-items:center;gap:.7rem;
    font-family:'Cormorant Garamond',serif;font-style:italic;
    color:rgba(245,242,232,.85);font-size:1.05rem;
    text-decoration:none;cursor:pointer;background:none;border:0;
    padding-top:1.8rem;margin-top:1rem;
    border-top:1px solid rgba(212,180,100,.25);
    transition:color .3s;
    animation:shareGlow 3s ease-in-out infinite 6s;
  }
  @keyframes shareGlow{
    0%,100%{color:rgba(245,242,232,.85)}
    50%{color:var(--gold-bright)}
  }
  .share:hover{color:var(--gold-bright)}
  .share i{color:#25D366;font-size:1.25rem;filter:drop-shadow(0 0 6px rgba(37,211,102,.4))}
  .share-underline{
    display:inline-block;
    background-image:linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    background-repeat:no-repeat;
    background-size:100% 1px;
    background-position:0 100%;
    padding-bottom:2px;
  }

  @media(max-width:640px){
    .stage{padding:5rem 1rem 3rem}
    .names{font-size:4rem;margin-bottom:1.4rem}
    .date-line{font-size:.85rem;letter-spacing:.32em;padding-left:1rem;padding-right:.5rem}
    .venue-line{font-size:.9rem;margin-bottom:2.6rem}
    .cd-num{font-size:2.6rem}
    .cd-labels span{font-size:.5rem;letter-spacing:.32em;min-width:3.6em}
    .cd-labels{gap:.5rem}
    .countdown-line{gap:.35rem}
    .cd-dot{width:6px;height:6px}
    .cta-row{gap:.6rem;flex-direction:column;align-items:stretch}
    .cta-btn{justify-content:center;font-size:.6rem;letter-spacing:.28em}
    .overline{font-size:.7rem;letter-spacing:.45em}
    .italic{font-size:1rem}
    .cta-title{font-size:1rem}
    .share{font-size:.95rem}
  }
</style>
</head>
<body>

<a href="index.html" class="back" aria-label="Back to gallery"><i class="fas fa-arrow-left"></i></a>
<div class="label"><b>Teaser 2</b> &middot; Cinematic Stage</div>

<div class="stage">
  <div class="top-orn reveal" id="orn">
    <span class="fl"></span>
    <svg viewBox="0 0 24 24"><path d="M12 2 L14.5 9.5 L22 12 L14.5 14.5 L12 22 L9.5 14.5 L2 12 L9.5 9.5 Z"/></svg>
    <span class="fl"></span>
  </div>
  <div class="overline reveal" id="r1">Save the Date</div>
  <div class="italic reveal" id="r2">for the wedding of</div>
  <h1 class="names reveal" id="r3">Eric <span class="amp">&amp;</span> Sherita</h1>
  <div class="date-line reveal" id="r4">SAT &middot; 28 NOV 2026 &middot; 12PM</div>
  <div class="venue-line reveal" id="r5">North Brunswick, New Jersey</div>

  <div class="countdown-line reveal" id="r6" aria-label="Countdown">
    <span class="cd-num" id="cdDays">--</span>
    <span class="cd-dot"></span>
    <span class="cd-num" id="cdHours">--</span>
    <span class="cd-dot"></span>
    <span class="cd-num" id="cdMin">--</span>
    <span class="cd-dot"></span>
    <span class="cd-num" id="cdSec">--</span>
  </div>
  <div class="cd-labels reveal" id="r7">
    <span>Days</span><span>Hours</span><span>Minutes</span><span>Seconds</span>
  </div>

  <div class="cta-title reveal" id="r8">Save this day to your calendar</div>
  <div class="cta-row reveal" id="r9">
    <a class="cta-btn" href="#" target="_blank" rel="noopener"><i class="fab fa-google"></i> Google</a>
    <a class="cta-btn" href="#" download><i class="fab fa-apple"></i> Apple</a>
    <a class="cta-btn" href="#" download><i class="fas fa-envelope"></i> Outlook</a>
  </div>

  <button class="share reveal" id="r10" onclick="alert('Share opens WhatsApp with the link + preview')">
    <i class="fab fa-whatsapp"></i>
    <span class="share-underline">Share this joy with family &amp; friends</span>
  </button>
</div>

<script>
/* Sequenced fade-in reveal */
const seq = ['orn','r1','r2','r3','r4','r5','r6','r7','r8','r9','r10'];
seq.forEach((id, i) => {
  setTimeout(() => document.getElementById(id).classList.add('in'), 300 + i * 320);
});

/* Dust motes */
for (let i = 0; i < 14; i++){
  const m = document.createElement('div');
  m.className = 'mote';
  m.style.left = Math.random() * 100 + 'vw';
  m.style.animationDuration = (14 + Math.random() * 8) + 's';
  m.style.animationDelay = (Math.random() * 8) + 's';
  document.body.appendChild(m);
}

/* Countdown */
const targetDate = new Date('2026-11-28T17:00:00+00:00').getTime();
function tick(){
  const now = Date.now();
  let diff = Math.max(0, targetDate - now);
  const d = Math.floor(diff / 86400000);
  const h = Math.floor((diff / 3600000) % 24);
  const m = Math.floor((diff / 60000) % 60);
  const s = Math.floor((diff / 1000) % 60);
  document.getElementById('cdDays').textContent = String(d).padStart(2,'0');
  document.getElementById('cdHours').textContent = String(h).padStart(2,'0');
  document.getElementById('cdMin').textContent = String(m).padStart(2,'0');
  document.getElementById('cdSec').textContent = String(s).padStart(2,'0');
}
tick(); setInterval(tick, 1000);
</script>

</body>
</html>
